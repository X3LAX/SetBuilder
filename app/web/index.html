<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SetBuilder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side">
  <div class="logo"><img src="icon.png" width="26" height="26" alt="">SetBuilder</div>
  <div id="projBox">
    <div class="label">Projet</div>
    <button id="projBtn" class="proj">Choisir un projet</button>
  </div>
  <div>
    <div class="label">Préparer le set</div>
    <nav>
      <a data-view="import"><b>1</b>Importer<i class="badge" id="bImport"></i></a>
      <a data-view="library"><b>2</b>Bibliothèque<i class="badge" id="bLibrary"></i></a>
      <a data-view="set"><b>3</b>Set<i class="badge" id="bSet"></i></a>
      <a data-view="export"><b>4</b>Export<i class="badge" id="bExport"></i></a>
    </nav>
  </div>
  <div>
    <div class="label">Outils</div>
    <nav>
      <a data-view="soundcloud"><b class="tool sc">☁</b>SoundCloud</a>
      <a data-view="spotify"><b class="tool sp">♫</b>Spotify</a>
      <a data-view="discover"><b class="tool di">✦</b>Découverte</a>
    </nav>
  </div>
  <nav class="bottom">
    <a data-view="settings"><b class="tool">⚙</b>Réglages</a>
  </nav>
</aside>

<main>
  <header>
    <h1 id="title">Projets</h1>
    <div id="job" hidden><div class="msg"></div><div class="bar"><i></i></div></div>
  </header>
  <section id="view"></section>
</main>

<footer id="player">
  <img id="pCover" alt="">
  <div class="pInfo"><div id="pTitle">—</div><div id="pSub" class="muted"></div></div>
  <button id="pPlay" class="round" title="Lecture / pause">▶</button>
  <input id="pSeek" type="range" min="0" max="1000" value="0">
  <span id="pTime" class="muted">0:00</span>
  <input id="pVol" type="range" min="0" max="100" value="80" title="Volume">
</footer>
<audio id="a1" preload="none"></audio><audio id="a2" preload="none"></audio>
<div id="toast"></div>
<div id="modal" hidden><div class="card"></div></div>
<script src="app.js"></script>
</body>
</html>
